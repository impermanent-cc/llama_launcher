name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor is 3.12 (see pyproject requires-python); test it
        # and the version developed on (3.13) on real runners.
        python-version: ["3.12", "3.13"]
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v5
      # Qt runtime libs PySide6 needs headless (offscreen). No audio libs —
      # Llama Launcher uses only QtCore/QtGui/QtWidgets. Mirrored by the
      # localci Containerfile — keep the two lists in sync.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0t64
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: pip install -e .[dev]
      - name: Run tests
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
