name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Qt runtime libs PySide6 needs headless (offscreen). No audio libs —
      # Llama Launcher uses only QtCore/QtGui/QtWidgets. Mirrored by the
      # localci Containerfile — keep the two lists in sync.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0t64
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install project
        run: pip install -e .[dev]
      - name: Run tests
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
