name: CI

on:
  push:
  pull_request:

# Every job only reads the checkout; none writes to the repository or its
# packages, so the default GITHUB_TOKEN is narrowed to contents: read.
permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No em or en dashes in tracked text
        run: |
          if git ls-files -z | grep -zvE '\.(png|jpe?g|gif|ico|svg|pdf|woff2?|ttf|otf|onnx|wav|ogg|mp3|zip|gz)$' \
            | grep -zvE '^(README\.md|CHANGELOG\.md|RPC\.md)$' \
            | LC_ALL=C xargs -0 grep -nP '\xe2\x80\x94|\xe2\x80\x93' 2>/dev/null; then
            echo "em or en dash found"; exit 1; fi
      - name: Tracked text is ASCII
        run: |
          if git ls-files -z | grep -zvE '\.(png|jpe?g|gif|ico|svg|pdf|woff2?|ttf|otf|onnx|wav|ogg|mp3|zip|gz)$' \
            | grep -zvE '^(uv|poetry)\.lock$' \
            | grep -zvE '^(README\.md|CHANGELOG\.md|RPC\.md)$' \
            | LC_ALL=C xargs -0 grep -nP '[\x80-\xff]' 2>/dev/null; then
            echo "non-ASCII text found"; exit 1; fi

  # ruff version matches the workflow standard pin.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install ruff
        run: pip install ruff==0.16.5
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor is 3.12 (see pyproject requires-python); test it
        # and the version developed on (3.13) on real runners.
        python-version: ["3.12", "3.13"]
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      # Qt runtime libs PySide6 needs headless (offscreen). No audio libs:
      # Llama Launcher uses only QtCore/QtGui/QtWidgets. Mirrored by the
      # localci Containerfile, so keep the two lists in sync.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0t64
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: pip install -e .[dev]
      - name: Run tests
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen
